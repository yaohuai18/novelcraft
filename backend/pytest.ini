[pytest]
; 阶段 1 冻结期新增：把关键回归测试从 backend/temp（被 .gitignore 忽略）
; 迁入 backend/tests 正式目录后，提供统一可追踪的测试入口。
; 运行方式：cd backend && python -m pytest
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q -ra --strict-markers
markers =
    offline: 离线用例（本目录用例必须离线：禁止真实网络 / 真实数据库 / 真实 API Key）
    formal_db: 读取正式库 backend/novelcraft.db 的只读指纹检查（默认不在日常回归中运行）
